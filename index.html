<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Menü</title>

    <style>
        body {
            margin: 0;
            background: #111;
            padding: 20px 0;
            font-family: sans-serif;
        }

        /* PDF Sayfa Tasarımı */
        .page {
            margin-bottom: 30px;
            border-bottom: 2px dashed #444;
            padding-bottom: 30px;
        }

        canvas {
            display: block;
            margin: 0 auto;
            width: 100% !important;
            height: auto !important;
            background: #fff;
            box-shadow: 0 8px 25px rgba(0,0,0,.4);
            border-radius: 6px;
        }

        /* Mesaj Kutusu (Modal) Tasarımı */
        #welcome-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }

        .modal-content {
            background: #222;
            color: #fff;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            max-width: 85%;
            border: 1px solid #444;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
        }

        .modal-content p {
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        #close-btn {
            background: #f1c40f;
            color: #000;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
            text-transform: uppercase;
        }

        #close-btn:active {
            transform: scale(0.95);
        }

        /* Gizleme Sınıfı */
        .hidden {
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>

<div id="welcome-modal">
    <div class="modal-content">
        <p>Değerli müşterilerimiz, kasaya hesap ödemeye giderken lütfen QR kodun altındaki masa numarasını söyleyiniz.</p>
        <button id="close-btn">Tamam</button>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script>
    // --- PDF Görüntüleme Kodları ---
    const url = 'menu.pdf';

    pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    pdfjsLib.getDocument(url).promise.then(pdf => {
        for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
            pdf.getPage(pageNum).then(page => {
                const scale = 1.5;
                const viewport = page.getViewport({ scale });

                const wrapper = document.createElement("div");
                wrapper.className = "page";

                const canvas = document.createElement("canvas");
                const context = canvas.getContext("2d");

                canvas.width = viewport.width;
                canvas.height = viewport.height;

                wrapper.appendChild(canvas);
                document.body.appendChild(wrapper);

                page.render({
                    canvasContext: context,
                    viewport: viewport
                });
            });
        }
    }).catch(err => {
        console.error("PDF yüklenirken hata oluştu: ", err);
    });

    // --- Mesaj Kutusu Kontrol Kodları ---
    const modal = document.getElementById('welcome-modal');
    const closeBtn = document.getElementById('close-btn');

    function closeModal() {
        modal.classList.add('hidden');
        setTimeout(() => {
            modal.style.display = 'none';
        }, 500);
    }

    closeBtn.addEventListener('click', closeModal);

    // Otomatik kapanma süresi 5 saniyeye (5000ms) ayarlandı
    setTimeout(closeModal, 5000);
</script>

</body>
</html>
